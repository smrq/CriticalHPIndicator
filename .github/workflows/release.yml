name: Create Release

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT: "CriticalHPIndicator"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Version
        shell: bash
        run: |
          REF_NAME="${{ github.ref_name }}"
          VERSION=$(echo "$REF_NAME" | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare Environment
        uses: ./.github/actions/prepare-environment
        with:
          project: ${{ env.PROJECT }}

      - name: Build
        uses: ./.github/actions/build
        with:
          project: ${{ env.PROJECT }}
          version: ${{ env.VERSION }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release create ${{ github.ref_name }} ./$PROJECT.zip

      - name: Update repo.json
        uses: ./.github/actions/update-repo
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          project: ${{ env.PROJECT }}
          version: ${{ env.VERSION }}
